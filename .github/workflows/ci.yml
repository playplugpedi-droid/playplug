name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: CLI smoke tests
        run: |
          set -u
          social-publisher --version
          social-publisher status
          head -c 1024 /dev/urandom > /tmp/test.mp4
          if social-publisher publish /nonexistent.mp4 2>/dev/null; then
            echo "expected failure for missing video file"
            exit 1
          fi
          social-publisher publish /nonexistent.mp4 --platforms linkedin 2>&1 | grep -q "Unknown platform"
          out=$(social-publisher publish /tmp/test.mp4 --platforms youtube,tiktok,facebook,instagram 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -ne 1 ] || ! echo "$out" | grep -q "no configured platforms"; then
            echo "expected exit 1 with 'no configured platforms'"
            exit 1
          fi
